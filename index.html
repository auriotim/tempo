<script>
'use strict';

// ═══════════════════════════════════════════════
//  STORAGE KEYS
// ═══════════════════════════════════════════════

const KEYS = {
  users:       'tempo_v1_users',
  clients:     'tempo_v1_clients',      // top-level: Sesame, URWay, R&D, etc.
  projects:    'tempo_v1_subprojects',  // projects/tasks under a client
  timeEntries: 'tempo_v1_time',
  expenses:    'tempo_v1_expenses',
  backlog:     'tempo_v1_backlog',
  timer:       'tempo_v1_timer',
  settings:    'tempo_v1_settings',
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ── Per-device active user ──────────────────────────────────────────────────
// Stored in localStorage (NOT shared Supabase settings) so that one team
// member logging in on their device cannot change whose view you see on yours.
const _ACTIVE_USER_KEY = 'tempo_v1_active_user_id';
function getActiveUserId() {
  // localStorage first; fall back to legacy Supabase setting on first run
  return localStorage.getItem(_ACTIVE_USER_KEY) || loadO(KEYS.settings).activeUserId || null;
}
function setActiveUserId(id) {
  if (id) localStorage.setItem(_ACTIVE_USER_KEY, id);
}

// ═══════════════════════════════════════════════
//  SUPABASE — config + in-memory cache
// ═══════════════════════════════════════════════

const _SB_URL = 'https://boynlwmuhunnfgruwamg.supabase.co';
const _SB_KEY = 'sb_publishable_hyin-isXk2gr4JV7DBKpMQ__J_f7ApE';
const _sb = supabase.createClient(_SB_URL, _SB_KEY);

// In-memory cache — all reads come from here; writes go to cache + Supabase
const _cache = {};

// Map localStorage keys → Supabase table names
const _TABLE = {
  [KEYS.clients]:     'clients',
  [KEYS.projects]:    'projects',
  [KEYS.timeEntries]: 'time_entries',
  [KEYS.expenses]:    'expenses',
  [KEYS.backlog]:     'backlog_items',
  [KEYS.users]:       'team_members',
};

// load/save — synchronous from cache perspective; writes fire async Supabase sync
const load  = (k, def=[]) => { const v = _cache[k]; return (v !== undefined && v !== null) ? v : def; };
const loadO = (k, def={}) => { const v = _cache[k]; return (v !== undefined && v !== null) ? v : def; };
const save  = (k, v) => {
  const old = _cache[k];
  _cache[k] = v;
  if (k === KEYS.timer) { localStorage.setItem(k, JSON.stringify(v)); return; } // timer stays local
  _sbSync(k, v, old).catch(e => console.warn('Supabase sync error', e));
};

// Pull all data from Supabase into cache
async function syncAll() {
  const pulls = Object.entries(_TABLE).map(async ([key, table]) => {
    const { data, error } = await _sb.from(table).select('id, data');
    if (!error && data) _cache[key] = data.map(r => r.data);
  });
  await Promise.all(pulls);
  // Settings
  const { data: s } = await _sb.from('app_settings').select('value').eq('key','main').maybeSingle();
  _cache[KEYS.settings] = s?.value || {};
  // Timer stays in localStorage
  try { _cache[KEYS.timer] = JSON.parse(localStorage.getItem(KEYS.timer)); } catch { _cache[KEYS.timer] = null; }
}

// Push one key's data to Supabase (diff-based: upsert changed, delete removed)
async function _sbSync(key, newData, oldData) {
  if (key === KEYS.settings) {
    await _sb.from('app_settings').upsert({ key: 'main', value: newData });
    return;
  }
  const table = _TABLE[key];
  if (!table || !Array.isArray(newData)) return;
  // Delete records removed from the array
  if (Array.isArray(oldData) && oldData.length > 0) {
    const newIds = new Set(newData.map(i => i.id));
    const gone   = oldData.filter(i => !newIds.has(i.id)).map(i => i.id);
    if (gone.length) await _sb.from(table).delete().in('id', gone);
  }
  // Upsert remaining records
  if (newData.length > 0) {
    const rows = newData.map(item => ({ id: item.id, data: item, updated_at: new Date().toISOString() }));
    await _sb.from(table).upsert(rows);
  }
}

// On first login: if Supabase is empty but localStorage has data, import it automatically
async function maybeImportLocalStorage() {
  if ((_cache[KEYS.clients] || []).length > 0) return; // already has data
  const lsClients = (() => { try { return JSON.parse(localStorage.getItem(KEYS.clients)) || []; } catch { return []; } })();
  if (lsClients.length === 0) return;
  const migrateKeys = [KEYS.clients, KEYS.projects, KEYS.timeEntries, KEYS.expenses, KEYS.backlog, KEYS.users];
  for (const k of migrateKeys) {
    const data = (() => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } })();
    if (data.length > 0) { _cache[k] = data; await _sbSync(k, data, []); }
  }
  const lsSettings = (() => { try { return JSON.parse(localStorage.getItem(KEYS.settings)) || {}; } catch { return {}; } })();
  _cache[KEYS.settings] = lsSettings;
  await _sb.from('app_settings').upsert({ key: 'main', value: lsSettings });
  toast('Your existing data has been synced to the shared workspace ✓');
}

// Ensure the logged-in auth user has a team_member record
async function ensureTeamMember(authUser) {
  const members = DB.users();
  // Primary: match by authId
  let existing = members.find(m => m.authId === authUser.id);
  // Fallback: match by email (handles members imported from localStorage without authId)
  if (!existing && authUser.email) {
    existing = members.find(m => m.email === authUser.email);
    if (existing) {
      // Backfill authId so we don't create a duplicate next time
      DB.saveU(members.map(m => m.id === existing.id ? {...m, authId: authUser.id} : m));
    }
  }
  if (existing) {
    setActiveUserId(existing.id);  // per-device only — does not touch shared settings
    return;
  }
  const colors = ['#0D9488','#6366F1','#D97706','#DC2626','#7C3AED','#0891B2','#65A30D','#DB2777'];
  const name = authUser.user_metadata?.full_name || authUser.email.split('@')[0];
  const newMember = { id: uid(), authId: authUser.id, email: authUser.email, name, color: colors[members.length % colors.length], createdAt: new Date().toISOString() };
  DB.saveU([...members, newMember]);
  setActiveUserId(newMember.id);  // per-device only
}

function deduplicateSelf() {
  // Merge any duplicate "me" records (same email, different id) into the active user
  const myId = getActiveUserId();
  if (!myId) return;
  const members = DB.users();
  const me = members.find(m => m.id === myId);
  if (!me) return;
  // Find other records with the same email OR same name (old records may lack email)
  const dupes = members.filter(m => m.id !== myId && (
    (me.email && m.email && m.email === me.email) ||
    (m.name && me.name && m.name === me.name)
  ));
  if (dupes.length === 0) return;
  const dupeIds = new Set(dupes.map(d => d.id));
  // Reassign time entries from duplicate IDs → my ID
  const times = DB.time();
  const updTimes = times.map(e => dupeIds.has(e.userId) ? {...e, userId: myId} : e);
  save(KEYS.timeEntries, updTimes);
  // Reassign expenses
  const exps = DB.exps();
  const updExps = exps.map(e => dupeIds.has(e.userId) ? {...e, userId: myId} : e);
  save(KEYS.expenses, updExps);
  // Reassign backlog createdBy
  const backlog = DB.backlog();
  const updBack = backlog.map(b => dupeIds.has(b.createdBy) ? {...b, createdBy: myId} : b);
  DB.saveBack(updBack);
  // Remove duplicate member records
  DB.saveU(members.filter(m => !dupeIds.has(m.id)));
}

// ── Login screen ──────────────────────────────
function renderLogin() {
  document.querySelector('.sidebar').style.display = 'none';
  document.querySelector('.main-content').style.display = 'none';
  if (document.getElementById('loginScreen')) return;
  const d = document.createElement('div');
  d.id = 'loginScreen';
  d.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F9FAFB">
      <div style="background:white;border-radius:1rem;padding:2rem;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.12)">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.75rem">
          <div style="width:2.25rem;height:2.25rem;background:#0D9488;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:1rem">T</div>
          <div><div style="font-weight:700;font-size:1.2rem;color:#111827">Tempo</div><div style="font-size:0.75rem;color:#9CA3AF">Time & Expense</div></div>
        </div>
        <div id="loginErr" style="display:none;background:#FEF2F2;color:#DC2626;font-size:0.8rem;padding:0.5rem 0.75rem;border-radius:0.4rem;margin-bottom:1rem;border:1px solid #FECACA"></div>
        <div id="signupName_wrap" style="display:none;margin-bottom:0.875rem">
          <label style="font-size:0.8rem;font-weight:500;color:#6B7280;display:block;margin-bottom:0.25rem">Your name</label>
          <input type="text" id="signupName" placeholder="Jane Smith" style="width:100%;padding:0.5rem 0.7rem;border:1px solid #D1D5DB;border-radius:0.4rem;font-size:0.875rem;box-sizing:border-box">
        </div>
        <div style="margin-bottom:0.875rem">
          <label style="font-size:0.8rem;font-weight:500;color:#6B7280;display:block;margin-bottom:0.25rem">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" style="width:100%;padding:0.5rem 0.7rem;border:1px solid #D1D5DB;border-radius:0.4rem;font-size:0.875rem;box-sizing:border-box">
        </div>
        <div style="margin-bottom:1.25rem">
          <label style="font-size:0.8rem;font-weight:500;color:#6B7280;display:block;margin-bottom:0.25rem">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" style="width:100%;padding:0.5rem 0.7rem;border:1px solid #D1D5DB;border-radius:0.4rem;font-size:0.875rem;box-sizing:border-box" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button onclick="doLogin()" id="loginBtn" style="width:100%;background:#0D9488;color:white;border:none;padding:0.7rem;border-radius:0.5rem;font-size:0.9rem;font-weight:600;cursor:pointer">Sign in</button>
        <div style="margin-top:1rem;text-align:center">
          <button onclick="toggleLoginMode()" id="toggleLoginBtn" style="font-size:0.8rem;color:#0D9488;background:none;border:none;cursor:pointer;text-decoration:underline">Don't have an account? Sign up</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(d);
}

let _loginIsSignup = false;
function toggleLoginMode() {
  _loginIsSignup = !_loginIsSignup;
  document.getElementById('signupName_wrap').style.display = _loginIsSignup ? 'block' : 'none';
  document.getElementById('loginBtn').textContent          = _loginIsSignup ? 'Create account' : 'Sign in';
  document.getElementById('toggleLoginBtn').textContent    = _loginIsSignup ? 'Already have an account? Sign in' : "Don't have an account? Sign up";
  document.getElementById('loginErr').style.display = 'none';
}

async function doLogin() {
  const email    = (document.getElementById('loginEmail')?.value || '').trim();
  const password = document.getElementById('loginPassword')?.value || '';
  const errEl    = document.getElementById('loginErr');
  const btn      = document.getElementById('loginBtn');
  if (!email || !password) { errEl.textContent = 'Please enter your email and password'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Please wait…'; btn.disabled = true;
  let result;
  if (_loginIsSignup) {
    const name = (document.getElementById('signupName')?.value || '').trim();
    if (!name) { errEl.textContent = 'Please enter your name'; errEl.style.display = 'block'; btn.textContent = 'Create account'; btn.disabled = false; return; }
    result = await _sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
    if (!result.error && result.data?.user && !result.data.session) {
      errEl.style.display = 'none';
      btn.textContent = '✓ Check your email to confirm';
      return;
    }
  } else {
    result = await _sb.auth.signInWithPassword({ email, password });
  }
  if (result.error) {
    errEl.textContent = result.error.message; errEl.style.display = 'block';
    btn.textContent = _loginIsSignup ? 'Create account' : 'Sign in'; btn.disabled = false;
    return;
  }
  document.getElementById('loginScreen')?.remove();
  document.querySelector('.sidebar').style.display = '';
  document.querySelector('.main-content').style.display = '';
  await init();
}

async function signOut() {
  if (!confirm('Sign out?')) return;
  await _sb.auth.signOut();
  location.reload();
}

// ═══════════════════════════════════════════════
//  DATA LAYER
// ═══════════════════════════════════════════════

const DB = {
  // ── Users ──────────────────────────────────
  users:    ()  => load(KEYS.users),
  saveU:    (u) => save(KEYS.users, u),

  // ── Clients (top level) ────────────────────
  clients:       (inclArch=false) => { const a = load(KEYS.clients); return inclArch ? a : a.filter(c=>c.status!=='archived'); },
  client:        (id) => load(KEYS.clients).find(c=>c.id===id),
  saveClients:   (c)  => save(KEYS.clients, c),

  // ── Projects (under a client) ──────────────
  projs:         (clientId=null) => { const a = load(KEYS.projects); return clientId ? a.filter(p=>p.clientId===clientId&&p.status!=='archived') : a.filter(p=>p.status!=='archived'); },
  proj:          (id) => load(KEYS.projects).find(p=>p.id===id),
  saveProjs:     (p)  => save(KEYS.projects, p),
  addProj:       (p)  => { const a = load(KEYS.projects); p.id=uid(); a.push(p); save(KEYS.projects,a); return p; },

  // ── Time entries ───────────────────────────
  time:     () => load(KEYS.timeEntries),
  saveTime: (t) => save(KEYS.timeEntries, t),
  addTime:  (e) => { const a = load(KEYS.timeEntries); e.id=uid(); a.push(e); save(KEYS.timeEntries,a); return e; },

  // ── Expenses ───────────────────────────────
  exps:    () => load(KEYS.expenses),
  saveExp: (e) => save(KEYS.expenses, e),
  addExp:  (e) => { const a = load(KEYS.expenses); e.id=uid(); a.push(e); save(KEYS.expenses,a); return e; },

  // ── Backlog ────────────────────────────────
  backlog:  () => load(KEYS.backlog),
  saveBack: (b) => save(KEYS.backlog, b),

  // ── Timer ──────────────────────────────────
  timer:    () => loadO(KEYS.timer, { running:false, startedAt:null, clientId:'', projectId:'', userId:'', notes:'', accum:0 }),
  saveTimer:(t) => save(KEYS.timer, t),

  // ── Settings ───────────────────────────────
  settings: () => loadO(KEYS.settings, { activeUserId:null }),
  saveSet:  (s) => save(KEYS.settings, s),
};

// ═══════════════════════════════════════════════
//  MIGRATION (old model → new model)
// ═══════════════════════════════════════════════

function migrate() {
  const oldRaw = localStorage.getItem('tempo_v1_projects');
  const hasNew = localStorage.getItem(KEYS.clients);
  if (!oldRaw || hasNew) return; // nothing to migrate

  try {
    const oldPs = JSON.parse(oldRaw);
    // Old "projects" become clients
    const clients = oldPs.map(p => ({
      id: p.id, name: p.name, type: p.type||'client',
      rate: p.rate||null, color: p.color||'#6366F1',
      status: p.status||'active', createdAt: p.createdAt||new Date().toISOString()
    }));
    save(KEYS.clients, clients);
    save(KEYS.projects, []); // start with empty sub-projects

    // Time entries: rename projectId → clientId
    const te = load(KEYS.timeEntries).map(e => ({ ...e, clientId: e.projectId||e.clientId||'', projectId: null }));
    save(KEYS.timeEntries, te);

    // Expenses: same
    const ex = load(KEYS.expenses).map(e => ({ ...e, clientId: e.projectId||e.clientId||'', projectId: null }));
    save(KEYS.expenses, ex);

    // Backlog: same
    const bl = load(KEYS.backlog).map(b => ({ ...b, clientId: b.projectId||b.clientId||'', projectId: null }));
    save(KEYS.backlog, bl);


    localStorage.removeItem('tempo_v1_projects');
  } catch(e) { console.warn('Migration failed', e); }
}

function migrateBacklogModel() {
  // Migrate old status-based backlog items to weekOf/archivedAt model
  const items = load(KEYS.backlog);
  let changed = false;
  const cw = currentWeek();
  const migrated = items.map(b => {
    if(b.archivedAt !== undefined) return b; // already migrated
    changed = true;
    if(b.status==='done') return {...b, archivedAt: b.createdAt||new Date().toISOString(), weekOf: null};
    if(b.status==='in-progress') return {...b, weekOf: cw, archivedAt: null};
    return {...b, weekOf: null, archivedAt: null};
  });
  if(changed) save(KEYS.backlog, migrated);
}

function migrateUserIds() {
  // Backfill any time/expense entries with empty userId → current user
  const myId = activeViewer();
  if (!myId) return;
  const times = DB.time();
  let tc = false;
  const ut = times.map(e => { if(e.userId) return e; tc=true; return {...e, userId: myId}; });
  if(tc) save(KEYS.timeEntries, ut);
  const exps = DB.exps();
  let ec = false;
  const ue = exps.map(e => { if(e.userId) return e; ec=true; return {...e, userId: myId}; });
  if(ec) save(KEYS.expenses, ue);
}

function migrateVisibility() {
  // Add visibility + ownerId to existing data that lacks it
  const myId = activeViewer();
  const clients = DB.clients(true);
  let cc = false;
  const uc = clients.map(c => { if(c.visibility!==undefined)return c; cc=true; return {...c,visibility:'public',ownerId:myId}; });
  if(cc) DB.saveClients(uc);

  const times = DB.time();
  let tc = false;
  const ut = times.map(e => { if(e.visibility!==undefined)return e; tc=true; return {...e,visibility:'public'}; });
  if(tc) save(KEYS.timeEntries, ut);

  const exps = DB.exps();
  let ec = false;
  const ue = exps.map(e => { if(e.visibility!==undefined)return e; ec=true; return {...e,visibility:'public'}; });
  if(ec) save(KEYS.expenses, ue);

  const backlog = DB.backlog();
  let bc = false;
  const ub = backlog.map(b => { if(b.visibility!==undefined)return b; bc=true; return {...b,visibility:'public',createdBy:b.createdBy||myId}; });
  if(bc) DB.saveBack(ub);
}

function todayStr() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function firstOfMonth() { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`; }
function currentWeek() { const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1),m=new Date(d.getFullYear(),d.getMonth(),diff); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`; }
function weekLabel(wk) { if(!wk)return''; const d=new Date(wk+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function itemAgedays(item) { const ref=item.lastTouchedAt||item.createdAt; if(!ref)return 0; return Math.floor((Date.now()-new Date(ref).getTime())/86400000); }
function daysUntil(dateStr) { if(!dateStr)return null; return Math.ceil((new Date(dateStr+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/86400000); }
function dueDateChip(dateStr) {
  if(!dateStr)return'';
  const d=daysUntil(dateStr),label=new Date(dateStr+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(d<0)  return `<span class="text-xs font-semibold text-red-600 bg-red-50 px-1.5 py-0.5 rounded-md border border-red-200">${Math.abs(d)}d overdue</span>`;
  if(d===0) return `<span class="text-xs font-semibold text-red-600 bg-red-50 px-1.5 py-0.5 rounded-md border border-red-200">Due today</span>`;
  if(d<=7)  return `<span class="text-xs font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded-md border border-amber-200">${label}</span>`;
  return `<span class="text-xs text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded-md">${label}</span>`;
}
function itemSortScore(item) {
  const d=daysUntil(item.dueDate);
  if(d!==null&&d<0) return d-1000;   // overdue: most negative = top
  if(item.urgent)   return -100;
  if(d!==null&&d<=7)return d;         // due soon: 0-7
  const pri={high:10,medium:20,low:30}[item.priority]||20;
  return pri + (itemAgedays(item)>30?-1:0); // stale items within same priority group float up
}
function nextRecurDate(fromStr,freq) {
  const d=new Date(fromStr+'T12:00:00');
  if(freq==='daily')   d.setDate(d.getDate()+1);
  else if(freq==='weekly')  d.setDate(d.getDate()+7);
  else if(freq==='biweekly') d.setDate(d.getDate()+14);
  else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtHours(h) { if(!h||h<0)return'0:00'; const hrs=Math.floor(h),min=Math.round((h-hrs)*60); return `${hrs}:${String(min).padStart(2,'0')}`; }
function fmtSecs(s)  { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function fmtDate(d)  { if(!d)return''; const [y,mo,day]=d.split('-').map(Number); return new Date(y,mo-1,day).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function fmtMoney(n) { return '$'+(+n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function groupBy(arr,fn) { return arr.reduce((acc,item)=>{ const k=typeof fn==='function'?fn(item):item[fn]; (acc[k]=acc[k]||[]).push(item); return acc; },{}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sanitizeKey(s) { return s.replace(/[^a-z0-9]/gi,'_'); }

function toast(msg, type='ok') {
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' toast-error':'');
  el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),350); },2700);
}
function showModal(html) {

}

// ═══════════════════════════════════════════════

function activeViewer() { return State.activeUser?.id || null; }

// Can the active user see this client at all?
function canSeeClient(c) {
  if (!c) return false;
  if (c.visibility === 'private') return c.ownerId === activeViewer();
  return true; // 'public' and 'confidential' are visible (masked if confidential)
}

// Should this client be shown as "Confidential" (visible but masked)?
function isClientConfidential(c) {
  return c?.visibility === 'confidential' && c.ownerId !== activeViewer();
}

// Display name — "Confidential Client" if masked, real name otherwise
function clientDisplayName(c) {
  if (!c) return '';
  if (isClientConfidential(c)) return 'Confidential Client';
  return c.name || '';
}

// Can the active user see this time/expense entry?
function canSeeEntry(entry) {
  if (!entry) return false;
  const client = DB.client(entry.clientId);
  if (client && !canSeeClient(client)) return false;
  if (entry.visibility === 'private') return entry.userId === activeViewer();
  return true;
}

// Can the active user edit/delete this entry?
function canEditEntry(entry) {
  if (!entry) return false;
  if (entry.visibility === 'team') return true;
  return entry.userId === activeViewer();
}

// Can the active user see this backlog item?
function canSeeBacklogItem(item) {
  if (!item) return false;
  if (item.clientId) {
    const client = DB.client(item.clientId);
    if (client && !canSeeClient(client)) return false;
  }
  if (item.visibility === 'private') return item.createdBy === activeViewer();
  return true;
}

// Can the active user edit/delete this backlog item?
function canEditBacklogItem(item) {
  if (!item) return false;
  if (item.visibility === 'team') return true;
  return item.createdBy === activeViewer();
}

// Visibility badge HTML
function visibilityBadge(v) {
  if (v === 'private') return `<span title="Private — only you" style="font-size:0.65rem;font-weight:700;padding:2px 6px;border-radius:9999px;background:#FEF3C7;color:#92400E">🔒 Private</span>`;
  if (v === 'team')    return `<span title="Team — everyone can edit" style="font-size:0.65rem;font-weight:700;padding:2px 6px;border-radius:9999px;background:#DBEAFE;color:#1E40AF">👥 Team</span>`;
  if (v === 'confidential') return `<span title="Confidential — visible as masked" style="font-size:0.65rem;font-weight:700;padding:2px 6px;border-radius:9999px;background:#F3E8FF;color:#6B21A8">🔐 Conf.</span>`;
  return ''; // public — no badge needed
}

const TimerEngine = {
  elapsed() {
    const t=DB.timer(); let total=t.accum||0;
    if(t.running&&t.startedAt) total+=Math.floor((Date.now()-t.startedAt)/1000);
    return total;
  },
  start(clientId, projectId, notes) {
    const t=DB.timer(); if(t.running)return;
    DB.saveTimer({...t, running:true, startedAt:Date.now(), clientId, projectId, userId:State.activeUser?.id||'', notes});
    this._tick(); this._sb(true);
  },
  pause() {
    const t=DB.timer(); if(!t.running)return;
    DB.saveTimer({...t, running:false, accum:(t.accum||0)+Math.floor((Date.now()-t.startedAt)/1000), startedAt:null});
    clearInterval(State.timerTick); State.timerTick=null; this._sb(false); render();
  },
  reset() { clearInterval(State.timerTick); State.timerTick=null; DB.saveTimer({running:false,startedAt:null,clientId:'',projectId:'',userId:'',notes:'',accum:0}); this._sb(false); render(); },
  save() {
    const t=DB.timer(); const secs=this.elapsed();
    if(secs<60){toast('Less than 1 minute — keep going!','err');return;}
    if(!t.clientId){toast('Please select a client first','err');return;}
    DB.addTime({userId:t.userId||State.activeUser?.id||'',clientId:t.clientId,projectId:t.projectId||null,date:todayStr(),hours:Math.round(secs/36)/100,notes:t.notes||'',billable:true,createdAt:new Date().toISOString()});
    this.reset(); toast('Time entry saved! ✓');
  },
  _tick() {
    clearInterval(State.timerTick);
    State.timerTick=setInterval(()=>{
      const d=fmtSecs(this.elapsed());
      const el=document.getElementById('timerDisplay'); if(el)el.textContent=d;
      const sb=document.getElementById('sidebarTimerDisplay'); if(sb)sb.textContent=d;
    },1000);
  },
  _sb(show) { document.getElementById('sidebarTimerBar')?.classList.toggle('hidden',!show); },
  init() { const t=DB.timer(); if(t.running){this._tick();this._sb(true);} },
};

function buildBarChart(entries, clients, maskConf=false) {
  const data = clients.map(c=>({
    name: (maskConf && isClientConfidential(c)) ? 'Conf.' : clientDisplayName(c),
    color: isClientConfidential(c) ? '#9CA3AF' : (c.color||'#6366F1'),
    hrs: entries.filter(e=>e.clientId===c.id).reduce((s,e)=>s+e.hours,0)
  })).filter(d=>d.hrs>0);

  if(data.length===0) return `<div class="flex items-center justify-center text-xs text-gray-300 py-5">No entries</div>`;

  const W=280, chartH=70, padT=18, padB=26;
  const H=chartH+padT+padB;
  const n=data.length, gap=10;
  const barW=Math.min(40, Math.floor((W - gap*(n-1)) / n));
  const totalBarsW=n*barW+(n-1)*gap;
  const startX=(W-totalBarsW)/2;
  const maxHrs=Math.max(...data.map(d=>d.hrs));

  const bars=data.map((d,i)=>{
    const bh=Math.max(4, (d.hrs/maxHrs)*chartH);
    const x=startX+i*(barW+gap);
    const y=padT+chartH-bh;
    const cx=(x+barW/2).toFixed(1);
    const lbl=d.hrs<1?Math.round(d.hrs*60)+'m':fmtHours(d.hrs);
    const nm=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${bh.toFixed(1)}" rx="3" fill="${d.color}" opacity="0.82"/>
      <text x="${cx}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#374151" font-weight="600" font-family="-apple-system,sans-serif">${lbl}</text>
      <text x="${cx}" y="${(H-3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9CA3AF" font-family="-apple-system,sans-serif">${nm}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

function renderDashExpanded(client, allTime, allExp, monthStart) {
  const subPs  = DB.projs(client.id);
  const mTime  = allTime.filter(e=>e.clientId===client.id&&e.date>=monthStart);
  const mExp   = allExp.filter(e=>e.clientId===client.id&&e.date>=monthStart);

  // Bin by project (including null = no project)
  const projMap = {};
  mTime.forEach(e=>{
    const k=e.projectId||'__none__';
    projMap[k]=projMap[k]||{hrs:0,exp:0,days:{}};
    projMap[k].hrs+=e.hours;
    const day=parseInt(e.date.slice(8),10);
    projMap[k].days[day]=(projMap[k].days[day]||0)+e.hours;
  });
  mExp.forEach(e=>{ const k=e.projectId||'__none__'; projMap[k]=projMap[k]||{hrs:0,exp:0,days:{}}; projMap[k].exp+=(e.amount||0); });

  const hasData = Object.keys(projMap).length>0;

  return `
    <div class="border-b border-gray-100 bg-gray-50/60 px-8 py-3">
      ${!hasData ? '<p class="text-xs text-gray-400 italic mb-2">No activity this month</p>' :
        Object.entries(projMap).map(([k,v])=>{
          const p = k==='__none__' ? null : DB.proj(k);
          const effRate = p?.rate ?? client.rate ?? null;
          const rateHint = effRate ? `<span class="text-gray-400 ml-1">${fmtMoney(effRate)}/hr${p?.rateLabel?' · '+esc(p.rateLabel):''}</span>` : '';
          const label = p ? `${esc(p.name)}${rateHint}` : '<span class="italic text-gray-400">no project</span>';
          const dot = p ? `<span class="w-1.5 h-1.5 rounded-full flex-shrink-0 inline-block bg-gray-400" style="background:${client.color||'#6366F1'}"></span>` : '';
          const dayDots=Object.keys(v.days||{}).map(Number).sort((a,b)=>a-b).map(d=>{
            const h=v.days[d];
            return `<span title="Day ${d}: ${fmtHours(h)}" style="display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:9999px;background:${client.color||'#6366F1'};opacity:0.72;font-size:8.5px;font-weight:700;color:white;flex-shrink:0;cursor:default">${d}</span>`;
          }).join('');
          return `<div class="flex items-center gap-2.5 py-1 text-xs flex-wrap">
            ${dot}
            <span class="font-medium text-gray-700 w-36 truncate flex-shrink-0">${label}</span>
            ${v.hrs>0?`<span class="text-gray-600 font-semibold flex-shrink-0">${fmtHours(v.hrs)} <span class="text-gray-400 font-normal">hrs</span></span>`:''}
            ${v.exp>0?`<span class="text-gray-500 flex-shrink-0">${fmtMoney(v.exp)} exp</span>`:''}
            ${dayDots?`<div class="flex gap-1 flex-wrap ml-1">${dayDots}</div>`:''}
          </div>`;
        }).join('')
      }
      <div class="flex gap-4 mt-2 pt-2 border-t border-gray-200/60">
        <button onclick="navigate('log')" class="text-xs text-teal-600 hover:underline">View entries →</button>
        <button onclick="showAddProjectModal('${client.id}')" class="text-xs text-gray-400 hover:text-gray-700 hover:underline">+ Add project</button>
      </div>
    </div>`;
}

function onLogTypeChange(key) {
  const type=document.getElementById(`${key}_type`)?.value;
  const amtEl=document.getElementById(`${key}_amt`);
  const pfxEl=document.getElementById(`${key}_pfx`);
  const whatEl=document.getElementById(`${key}_what`);
  if(!amtEl)return;
  if(type==='time')       { amtEl.placeholder='hrs'; amtEl.disabled=false; amtEl.step='0.25'; amtEl.style.paddingLeft='0.55rem'; pfxEl?.classList.add('hidden'); if(whatEl)whatEl.placeholder='task or item'; }
  else if(type==='expense'){ amtEl.placeholder='0.00'; amtEl.disabled=false; amtEl.step='0.01'; amtEl.style.paddingLeft='1.25rem'; pfxEl?.classList.remove('hidden'); if(whatEl)whatEl.placeholder='what was purchased'; }
  else                    { amtEl.value=''; amtEl.placeholder='N/A'; amtEl.disabled=true; amtEl.style.paddingLeft='0.55rem'; pfxEl?.classList.add('hidden'); if(whatEl)whatEl.placeholder='item title (required)'; }
}

function onDashProjChange(key, clientId) {
  const sel=document.getElementById(`${key}_proj`);
  if(sel?.value==='__new__') { sel.value=''; showAddProjectModal(clientId, key); }

function submitClientLog(clientId) {
  const key    = sanitizeKey(clientId);
  const type   = document.getElementById(`${key}_type`)?.value;
  const amt    = document.getElementById(`${key}_amt`)?.value;
  const projId = document.getElementById(`${key}_proj`)?.value || null;
  const what   = (document.getElementById(`${key}_what`)?.value||'').trim();
  const note   = (document.getElementById(`${key}_note`)?.value||'').trim();
  const date   = document.getElementById(`${key}_date`)?.value || todayStr();
  const notes  = [what,note].filter(Boolean).join(' — ');
  const userId = State.activeUser?.id||'';

  if(type==='time') {
    const hours=parseFloat(amt);
    if(!hours||hours<=0){toast('Enter hours','err');return;}
    DB.addTime({userId,clientId,projectId:projId,date,hours,notes,billable:true,visibility:'public',createdAt:new Date().toISOString()});
    toast('Time logged ✓');
  } else if(type==='expense') {
    const amount=parseFloat(amt);
    if(!amount||amount<=0){toast('Enter an amount','err');return;}
    DB.addExp({userId,clientId,projectId:projId,date,amount,category:'Other',notes,billable:true,visibility:'public',createdAt:new Date().toISOString()});
    toast('Expense logged ✓');
  } else {
    if(!what){toast('Enter an item title','err');return;}
    const bl=DB.backlog();
    const now=new Date().toISOString();
    bl.push({id:uid(),title:what,description:note,priority:'medium',clientId,projectId:projId,weekOf:null,archivedAt:null,visibility:'public',createdBy:userId,createdAt:now,lastTouchedAt:now});
    DB.saveBack(bl);
    toast('Backlog item added ✓');
  }
  ['_amt','_what','_note'].forEach(s=>{ const el=document.getElementById(`${key}${s}`); if(el){el.value='';el.disabled=false;} });
  onLogTypeChange(key);
  render();
}

function renderLog() {

  if(f.project) entries=entries.filter(e=>e.projectId===f.project);
  if(f.user)    entries=entries.filter(e=>e.userId===f.user);

      dates.map(date=>`
        <div class="mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-semibold text-gray-700">${fmtDate(date)}</span>
            <span class="text-xs text-gray-400">${fmtMoney(grouped[date].reduce((s,e)=>s+(e.amount||0),0))}</span>
          </div>
          <div class="card overflow-hidden">${grouped[date].map(expRow).join('')}</div>
        </div>`).join('')
    }`;
}

function expRow(exp) {
  const client = DB.client(exp.clientId);
  const conf   = isClientConfidential(client);
  const proj   = (!conf && exp.projectId) ? DB.proj(exp.projectId) : null;
  const canEdit = exp.userId === activeViewer() || exp.visibility === 'team';
  const dispName = conf ? 'Confidential Client' : (client?.name||'');
  const dispColor = conf ? '#9CA3AF' : (client?.color||'#6366F1');
  return `
    <div class="entry-row px-4 py-3 flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-gray-800 truncate">
          ${client?`<span style="color:${dispColor}" class="mr-1">●</span>${conf?`<span class="italic text-gray-400">${esc(dispName)}</span>`:esc(dispName)}`:'<span class="text-gray-400 italic text-xs">No client</span>'}
          ${proj?`<span class="text-gray-400 mx-1.5">›</span><span class="text-gray-600">${esc(proj.name)}</span>`:''}
        </div>
        ${!conf?`<div class="text-xs text-gray-400 mt-0.5">${esc(exp.category||'Other')}${exp.notes?' · '+esc(exp.notes):''}</div>`:''}
      </div>
      <span class="text-xs ${exp.billable?'text-teal-500 font-semibold':'text-gray-300'}">$</span>
      <span class="text-sm font-semibold text-gray-700 w-20 text-right flex-shrink-0">${fmtMoney(exp.amount)}</span>
      <div class="flex gap-0.5 flex-shrink-0">
        ${canEdit?`<button onclick="editExpense('${exp.id}')" class="p-1.5 text-gray-300 hover:text-gray-600 rounded">✏️</button>`:''}
        ${canEdit?`<button onclick="delExpense('${exp.id}')" class="p-1.5 text-gray-300 hover:text-red-500 rounded">🗑</button>`:`<span class="w-8 inline-block"></span>`}
      </div>
    </div>`;
}

function renderClients() {
  const clients=DB.clients(true);
  const active=clients.filter(c=>c.status!=='archived');
  const archived=clients.filter(c=>c.status==='archived');
  const allTime=DB.time(), allExp=DB.exps();

  function clientCard(c) {
    const isArch=c.status==='archived';
    const hrs=allTime.filter(e=>e.clientId===c.id).reduce((s,e)=>s+e.hours,0);
    const expT=allExp.filter(e=>e.clientId===c.id).reduce((s,e)=>s+(e.amount||0),0);
    const subPs=DB.projs(c.id);
    return `
      <div class="card p-4 ${isArch?'opacity-60':''}">
        <div class="flex items-start gap-3">
          <div class="w-3.5 h-3.5 rounded-full flex-shrink-0 mt-1" style="background:${c.color||'#6366F1'}"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center flex-wrap gap-1.5 mb-1">
              <span class="font-semibold text-gray-800">${esc(c.name)}</span>
              ${getBadge(c.type)}
              ${isArch?'<span class="badge badge-internal">Archived</span>':''}
              ${c.visibility&&c.visibility!=='public'?visibilityBadge(c.visibility):''}
              ${c.rate?`<span class="text-xs text-teal-600">${fmtMoney(c.rate)}/hr</span>`:''}
            </div>
            <div class="text-xs text-gray-400 mb-3">${fmtHours(hrs)} hrs all time · ${fmtMoney(expT)} expenses</div>

            <!-- Sub-projects -->
            <div class="space-y-1 mb-2">
              ${subPs.length===0?`<p class="text-xs text-gray-400 italic">No projects yet</p>`:
                subPs.map(p=>`
                  <div class="flex items-center justify-between bg-gray-50 rounded px-3 py-1.5 text-sm">
                    <div class="min-w-0">
                      <span class="text-gray-700 font-medium">${esc(p.name)}</span>
                      ${p.rate?`<span class="text-xs text-teal-600 ml-2">${fmtMoney(p.rate)}/hr${p.rateLabel?' · '+esc(p.rateLabel):''}</span>`:p.rateLabel?`<span class="text-xs text-gray-400 ml-2">${esc(p.rateLabel)}</span>`:''}
                    </div>
                    <div class="flex gap-0.5 ml-2 flex-shrink-0">
                      <button onclick="showEditProjectModal('${p.id}')" class="p-1 text-gray-300 hover:text-gray-600 text-xs" title="Edit">✏️</button>
                      <button onclick="delSubProject('${p.id}')" class="p-1 text-gray-300 hover:text-red-500 text-xs" title="Delete">🗑</button>
                    </div>
                  </div>`).join('')
              }
            </div>
            <button onclick="showAddProjectModal('${c.id}')" class="text-xs text-teal-600 hover:underline font-medium">+ Add project</button>
          </div>
          <div class="flex gap-0.5 flex-shrink-0">
            <button onclick="editClient('${c.id}')" class="p-1.5 text-gray-300 hover:text-gray-600 rounded" title="Edit">✏️</button>
            <button onclick="archiveClient('${c.id}')" class="p-1.5 text-gray-300 hover:text-gray-600 rounded" title="${isArch?'Unarchive':'Archive'}">${isArch?'📂':'🗃'}</button>
            <button onclick="delClient('${c.id}')" class="p-1.5 text-gray-300 hover:text-red-500 rounded" title="Delete">🗑</button>
          </div>
        </div>
      </div>`;
  }

  return `
    ${active.length===0 ? emptyState('🏢','No clients yet','Add clients and R&D groups — each becomes a row on the dashboard.') :
      `<div class="space-y-3 mb-6">${active.map(clientCard).join('')}</div>`
    }
    ${archived.length>0?`
      <div><div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Archived</div>
      <div class="space-y-3">${archived.map(clientCard).join('')}</div></div>`:''}
  `;
}

// ═══════════════════════════════════════════════
//  VIEW: BACKLOG
// ═══════════════════════════════════════════════

function renderBacklog() {
  if(State.groomMode) return renderGroomMode();
  const all = DB.backlog();
  const active = all.filter(i => !i.archivedAt && canSeeBacklogItem(i));
  const cw = currentWeek();
  const backlogItems = active.filter(i => !i.weekOf);
  const thisWeekItems = active.filter(i => i.weekOf === cw);
  const staleCount = backlogItems.filter(i => itemAgedays(i) >= 30).length;
  const priIcon = {high:'🔴',medium:'🟡',low:'🔵'};
  const clients = DB.clients(true);
  const clientMap = {};
  clients.forEach(c => clientMap[c.id] = c);

  // Needs Attention: overdue or urgent items (for top strip)
  const needsAttention = backlogItems.filter(i => i.urgent || (i.dueDate && daysUntil(i.dueDate) < 0));
  const needsAttnIds = new Set(needsAttention.map(i => i.id));
  const regularItems = backlogItems.filter(i => !needsAttnIds.has(i.id));

  // Group regular backlog by client, sort within groups
  const byClient = {};
  regularItems.forEach(item => {
    const cid = item.clientId || '__none__';
    if(!byClient[cid]) byClient[cid] = [];
    byClient[cid].push(item);
  });
  Object.values(byClient).forEach(arr => arr.sort((a,b) => itemSortScore(a)-itemSortScore(b)));
  const clientOrder = Object.keys(byClient).sort((a,b) => byClient[b].length - byClient[a].length);

  function itemBadges(item) {
    const chips = [];
    if(item.urgent) chips.push(`<span class="text-xs font-bold text-red-500" title="Urgent">⚡</span>`);
    if(item.effort) {
      const effortLabel = {1:'1·xs',2:'2·sm',3:'3·md',5:'5·lg',8:'8·xl',13:'13·epic'}[item.effort]||item.effort;
      chips.push(`<span class="text-xs text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded font-mono" title="Effort">${effortLabel}</span>`);
    }
    if(item.recurring) {
      const freqLabel = {weekly:'wkly',biweekly:'2wk',monthly:'mo'}[item.recurFrequency]||'↺';
      chips.push(`<span class="text-xs text-indigo-500 font-medium" title="Recurring">↺ ${freqLabel}</span>`);
    }
    const dc = dueDateChip(item.dueDate);
    if(dc) chips.push(dc);
    return chips.length ? `<div class="flex items-center gap-1.5 mt-1.5 flex-wrap">${chips.join('')}</div>` : '';
  }

  function backlogCard(item, highlight=false) {
    const client = clientMap[item.clientId];
    const proj = item.projectId ? DB.proj(item.projectId) : null;
    const age = itemAgedays(item);
    const stale = age >= 30;
    const borderStyle = highlight ? 'border-amber-200 bg-amber-50/30' : 'border-gray-200 bg-white';
    const assignee = item.assignedTo ? DB.users().find(u=>u.id===item.assignedTo) : null;
    const canEdit = canEditBacklogItem(item);
    const vBadge = visibilityBadge(item.visibility);
    return `<div class="group relative ${borderStyle} border rounded-lg px-3 py-2.5 mb-2 hover:border-gray-300 hover:shadow-sm transition-all cursor-pointer" onclick="editBacklogItem('${item.id}')">
      <div class="flex items-start gap-2">
        <span class="text-xs mt-0.5 flex-shrink-0">${priIcon[item.priority]||'⚪'}</span>
        <div class="min-w-0 flex-1 pr-24">
          <div class="text-sm font-medium text-gray-800 leading-snug">${esc(item.title)}</div>
          ${item.description?`<div class="text-xs text-gray-400 mt-0.5 line-clamp-1">${esc(item.description)}</div>`:''}
          ${itemBadges(item)}
          ${proj?`<div class="text-xs text-gray-400 mt-1">${esc(proj.name)}</div>`:''}
          ${assignee?`<div class="text-xs text-indigo-400 mt-1">→ ${esc(assignee.name)}</div>`:''}
          ${vBadge?`<div class="mt-1">${vBadge}</div>`:''}
          ${!item.dueDate&&stale?`<div class="text-xs text-amber-500 mt-1">${age}d untouched</div>`:!item.dueDate&&age>14?`<div class="text-xs text-gray-300 mt-0.5">${age}d</div>`:''}
        </div>
      </div>
      <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
        <button onclick="event.stopPropagation();promoteToWeek('${item.id}')" title="Move to This Week" class="text-xs bg-teal-50 hover:bg-teal-100 text-teal-700 px-2 py-1 rounded font-medium whitespace-nowrap border border-teal-100">→ Week</button>
      </div>
    </div>`;
  }

  function weekCard(item) {
    const client = clientMap[item.clientId];
    const proj = item.projectId ? DB.proj(item.projectId) : null;
    return `<div class="group relative bg-white border border-gray-200 rounded-lg px-3 py-2.5 mb-2 hover:border-gray-300 hover:shadow-sm transition-all cursor-pointer" onclick="editBacklogItem('${item.id}')">
      <div class="flex items-start gap-2">
        <span class="text-xs mt-0.5 flex-shrink-0">${priIcon[item.priority]||'⚪'}</span>
        <div class="min-w-0 flex-1 pr-28">
          <div class="text-sm font-medium text-gray-800 leading-snug">${esc(item.title)}</div>
          ${item.description?`<div class="text-xs text-gray-400 mt-0.5 line-clamp-1">${esc(item.description)}</div>`:''}
          ${itemBadges(item)}
          ${client||proj?`<div class="text-xs text-gray-400 mt-1">${client?`<span style="color:${client.color||'#6366F1'}">●</span> ${esc(client.name)}`:''}${proj?` › ${esc(proj.name)}`:''}</div>`:''}
        </div>
      </div>
      <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
        <button onclick="event.stopPropagation();markItemDone('${item.id}')" title="Mark done" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 px-2 py-1 rounded font-medium border border-green-100">✓ Done</button>
        <button onclick="event.stopPropagation();pullToBacklog('${item.id}')" title="Send back to backlog" class="text-xs bg-gray-50 hover:bg-gray-100 text-gray-500 px-1.5 py-1 rounded border border-gray-100">← </button>
      </div>
    </div>`;
  }

  const wLabel = weekLabel(cw);
  const archivedCount = all.filter(i => i.archivedAt).length;

  return `
    <div class="flex items-center justify-between mb-5 no-print">
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-400">${backlogItems.length} in backlog${thisWeekItems.length?` · ${thisWeekItems.length} this week`:''}</span>
        ${staleCount>0
          ?`<button onclick="State.groomMode=true;render()" class="flex items-center gap-1.5 text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200 font-medium transition-colors">🧹 Groom <span class="bg-amber-200 text-amber-800 rounded-full px-1.5">${staleCount} stale</span></button>`
          :`<button onclick="State.groomMode=true;render()" class="text-xs text-gray-400 hover:text-gray-600 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition-colors">🧹 Groom backlog</button>`}
      </div>
      ${archivedCount>0?`<button onclick="showArchive()" class="text-xs text-gray-400 hover:text-gray-600 hover:underline">Archive (${archivedCount}) ↗</button>`:''}
    </div>
    <div class="flex gap-6" style="align-items:start">
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Backlog</span>
            <span class="text-xs text-gray-400">${backlogItems.length}</span>
          </div>
          <button onclick="showBacklogModal()" class="text-xs text-teal-600 hover:text-teal-800 font-medium">+ Add</button>
        </div>
        ${backlogItems.length===0
          ?`<div class="text-center text-gray-300 text-sm py-16 border-2 border-dashed border-gray-100 rounded-xl">Backlog is clear</div>`
          :`${needsAttention.length>0?`
            <div class="mb-5">
              <div class="flex items-center gap-1.5 mb-2 pb-1 border-b border-red-100">
                <span class="text-xs font-bold text-red-500 uppercase tracking-wider">Needs Attention</span>
                <span class="text-xs text-red-300">${needsAttention.length}</span>
              </div>
              ${needsAttention.sort((a,b)=>itemSortScore(a)-itemSortScore(b)).map(i=>backlogCard(i,true)).join('')}
            </div>`:''
          }${clientOrder.length>0?clientOrder.map(cid=>{
            const client = clientMap[cid];
            const items = byClient[cid];
            if(!items||!items.length) return '';
            return `<div class="mb-5">
              <div class="flex items-center gap-1.5 mb-2 pb-1 border-b border-gray-100">
                ${client?`<span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${client.color||'#6366F1'}"></span><span class="text-xs font-semibold text-gray-500">${esc(client.name)}</span>`:'<span class="text-xs font-semibold text-gray-400">No client</span>'}
                <span class="text-xs text-gray-300 ml-1">${items.length}</span>
              </div>
              ${items.map(i=>backlogCard(i)).join('')}
            </div>`;
          }).join(''):''}`
        }
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">This Week</span>
          <span class="text-xs text-gray-400">${thisWeekItems.length}</span>
          ${thisWeekItems.length>0?`<span class="text-xs text-gray-300">· ${wLabel}</span>`:''}
        </div>
        ${thisWeekItems.length===0
          ?`<div class="text-center text-gray-300 text-sm py-16 border-2 border-dashed border-gray-100 rounded-xl">Pull items from backlog →</div>`
          :thisWeekItems.map(weekCard).join('')
        }
      </div>
    </div>`;
}

function renderGroomMode() {
  const all = DB.backlog();
  const items = all
    .filter(i => !i.archivedAt && !i.weekOf)
    .sort((a,b) => new Date(a.lastTouchedAt||a.createdAt||0) - new Date(b.lastTouchedAt||b.createdAt||0));
  const clients = DB.clients(true);
  const clientMap = {};
  clients.forEach(c => clientMap[c.id] = c);
  const priIcon = {high:'🔴',medium:'🟡',low:'🔵'};
  return `
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div>
          <div class="text-lg font-bold text-gray-800">Groom Backlog</div>
          <div class="text-sm text-gray-500 mt-0.5">Oldest items first. Keep, archive (not happening soon), or delete (truly dead).</div>
        </div>
        <button onclick="State.groomMode=false;render()" class="btn-secondary px-4 py-2 rounded-lg text-sm">Done</button>
      </div>
      ${items.length===0
        ?`<div class="text-center py-20">
            <div class="text-4xl mb-3">✨</div>
            <div class="text-gray-600 font-semibold">Backlog is fresh</div>
            <div class="text-sm text-gray-400 mt-1">No items need attention</div>
            <button onclick="State.groomMode=false;render()" class="mt-5 btn-primary px-5 py-2 rounded-lg text-sm">Back to board</button>
          </div>`
        :items.map(item=>{
            const client = clientMap[item.clientId];
            const proj = item.projectId ? DB.proj(item.projectId) : null;
            const age = itemAgedays(item);
            const stale = age >= 30;
            return `<div class="card px-5 py-4 mb-3 flex items-start gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-start gap-2">
                  <span class="text-sm mt-0.5 flex-shrink-0">${priIcon[item.priority]||'⚪'}</span>
                  <div>
                    <div class="text-sm font-semibold text-gray-800">${esc(item.title)}</div>
                    ${item.description?`<div class="text-xs text-gray-400 mt-0.5">${esc(item.description)}</div>`:''}
                    <div class="flex items-center gap-2 mt-1.5">
                      ${client?`<span class="text-xs" style="color:${client.color||'#6366F1'}">● ${esc(client.name)}</span>`:''}
                      ${proj?`<span class="text-xs text-gray-400">› ${esc(proj.name)}</span>`:''}
                      <span class="text-xs ${stale?'text-amber-600 font-semibold':'text-gray-400'}">${age}d old</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="keepItem('${item.id}')" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium">Keep</button>
                <button onclick="archiveItem('${item.id}')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-medium">Archive</button>
                <button onclick="delBacklogItemSilent('${item.id}')" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-medium">Delete</button>
              </div>
            </div>`;
          }).join('')
      }
    </div>`;
}

// ═══════════════════════════════════════════════
//  VIEW: REPORTS
// ═══════════════════════════════════════════════

function renderReports() {
  const f=State.filters.reports;
  const te=DB.time().filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to));
  const exp=DB.exps().filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to));
  const clients=DB.clients(true);
  const usedIds=new Set([...te.map(e=>e.clientId),...exp.map(e=>e.clientId)]);
  const rows=clients.filter(c=>usedIds.has(c.id)).map(c=>{
    const billable=te.filter(e=>e.clientId===c.id&&e.billable);
    const expT=exp.filter(e=>e.clientId===c.id).reduce((s,e)=>s+(e.amount||0),0);
    const hasAnyRate=c.rate||billable.some(e=>{const p=e.projectId?DB.proj(e.projectId):null;return p?.rate;});
    const laborVal=hasAnyRate?billable.reduce((s,e)=>{
      const proj=e.projectId?DB.proj(e.projectId):null;
      const rate=proj?.rate??c.rate??0;
      return s+e.hours*rate;
    },0):null;
    // Invoice total = labor (hours × rate) + reimbursable expenses
    const value=laborVal!==null?laborVal+expT:null;
    return {c,hrs:te.filter(e=>e.clientId===c.id).reduce((s,e)=>s+e.hours,0),expT,value};
  }).sort((a,b)=>b.hrs-a.hrs);
  const totHrs=rows.reduce((s,r)=>s+r.hrs,0),totExp=rows.reduce((s,r)=>s+r.expT,0),totVal=rows.reduce((s,r)=>s+(r.value||0),0);
  const hasRate=rows.some(r=>r.value!==null);
  const users=DB.users();
  const userRows=users.map(u=>({u,hrs:te.filter(e=>e.userId===u.id).reduce((s,e)=>s+e.hours,0),exp:exp.filter(e=>e.userId===u.id).reduce((s,e)=>s+(e.amount||0),0)})).filter(r=>r.hrs>0||r.exp>0);
  const expByCat=groupBy(exp,'category'),cats=Object.keys(expByCat).sort();
  return `
    <div class="card p-4 mb-5 no-print">
      <div class="flex flex-wrap items-end gap-3">
        <div><label>From</label><input type="date" value="${f.from}" onchange="setFilter('reports','from',this.value)" class="py-1.5"></div>
        <div><label>To</label><input type="date" value="${f.to}" onchange="setFilter('reports','to',this.value)" class="py-1.5"></div>
        <button onclick="setReportRange('month')" class="btn-secondary px-3 py-2 rounded-lg text-xs">This month</button>
        <button onclick="setReportRange('lastmonth')" class="btn-secondary px-3 py-2 rounded-lg text-xs">Last month</button>
        <button onclick="setReportRange('year')" class="btn-secondary px-3 py-2 rounded-lg text-xs">This year</button>
        <div class="ml-auto flex gap-2">
          <button onclick="exportCSV()" class="btn-secondary px-4 py-2 rounded-lg text-sm">⬇ CSV</button>
          <button onclick="window.print()" class="btn-secondary px-4 py-2 rounded-lg text-sm">🖨 Print</button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="card p-5 text-center"><div class="text-2xl font-bold text-gray-900">${fmtHours(totHrs)}</div><div class="text-xs text-gray-400 mt-1 uppercase tracking-wide">Hours</div></div>
      <div class="card p-5 text-center"><div class="text-2xl font-bold text-gray-900">${fmtMoney(totExp)}</div><div class="text-xs text-gray-400 mt-1 uppercase tracking-wide">Expenses</div></div>
      <div class="card p-5 text-center"><div class="text-2xl font-bold text-teal-600">${hasRate?fmtMoney(totVal):'—'}</div><div class="text-xs text-gray-400 mt-1 uppercase tracking-wide">Invoice Total</div></div>
    </div>

function setReportRange(r) {
  const n=new Date(), yr=n.getFullYear(), mo=n.getMonth();
  let from,to;
  if(r==='month'){from=`${yr}-${String(mo+1).padStart(2,'0')}-01`;to=`${yr}-${String(mo+1).padStart(2,'0')}-${String(new Date(yr,mo+1,0).getDate()).padStart(2,'0')}`;}
  else if(r==='lastmonth'){const lm=new Date(yr,mo,0);from=`${lm.getFullYear()}-${String(lm.getMonth()+1).padStart(2,'0')}-01`;to=`${lm.getFullYear()}-${String(lm.getMonth()+1).padStart(2,'0')}-${String(lm.getDate()).padStart(2,'0')}`;}
  else{from=`${yr}-01-01`;to=`${yr}-12-31`;}
  State.filters.reports.from=from; State.filters.reports.to=to; render();
}

function exportCSV() {
  const f=State.filters.reports;
  const te=DB.time().filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to));
  const us=DB.users(); let csv='Date,User,Client,Project,Rate,Hours,Notes,Billable\n';
  te.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const c=DB.client(e.clientId), p=e.projectId?DB.proj(e.projectId):null, u=us.find(u=>u.id===e.userId);
    const rate=p?.rate??c?.rate??'';
    csv+=[e.date,u?.name||'',c?.name||'',p?.name||'',rate,e.hours,`"${(e.notes||'').replace(/"/g,'""')}"`,e.billable?'Yes':'No'].join(',')+'\n';
  });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`tempo-${f.from||'all'}-to-${f.to||'all'}.csv`; a.click(); toast('CSV exported ✓');
}

function delUser(id){if(!confirm('Delete this user?'))return;DB.saveU(DB.users().filter(u=>u.id!==id));refreshUserSelect();render();}
function exportData(){
  const data={users:DB.users(),clients:DB.clients(true),projects:load(KEYS.projects),timeEntries:DB.time(),expenses:DB.exps(),backlog:DB.backlog(),exportedAt:new Date().toISOString()};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`tempo-backup-${todayStr()}.json`; a.click(); toast('Backup exported ✓');
}
function importData(){
  const input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!confirm('This will replace all data. Continue?'))return;
        if(d.users)     DB.saveU(d.users);
        if(d.clients)   DB.saveClients(d.clients);
        if(d.projects)  save(KEYS.projects,d.projects);
        if(d.timeEntries) DB.saveTime(d.timeEntries);
        if(d.expenses)  DB.saveExp(d.expenses);
        if(d.backlog)   DB.saveBack(d.backlog);
        refreshUserSelect(); render(); toast('Backup imported ✓');
      }catch{toast('Invalid file','err');}
    }; reader.readAsText(file);
  }; input.click();
}
function clearData(){
  if(!confirm('Delete ALL data? This cannot be undone.'))return;
  Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
  refreshUserSelect(); render(); toast('Data cleared');
}

function editBacklogItem(id){showBacklogModal(id);}
function saveBacklogItem(id){
  const title=document.getElementById('bl_title')?.value?.trim();
  if(!title){toast('Please enter a title','err');return;}
  const desc=document.getElementById('bl_desc')?.value?.trim()||'';
  const priority=document.getElementById('bl_priority')?.value||'medium';
  const dueDate=document.getElementById('bl_due')?.value||null;
  const effortRaw=document.getElementById('bl_effort')?.value;
  const effort=effortRaw?parseInt(effortRaw):null;
  const urgent=document.getElementById('bl_urgent')?.checked||false;
  const recurring=document.getElementById('bl_recurring')?.checked||false;
  const recurFrequency=recurring?(document.getElementById('bl_recurFreq')?.value||'weekly'):null;
  // Resolve client: existing ID from hidden field, or create new from typed text
  let clientId=document.getElementById('bl_client')?.value||null;
  if(!clientId){
    const newName=document.getElementById('bl_client_txt')?.value?.trim();
    if(newName){
      const newC={id:uid(),name:newName,type:'client',rate:null,color:CLIENT_COLORS[0],status:'active',createdAt:new Date().toISOString()};
      const allC=DB.clients(true);allC.push(newC);DB.saveClients(allC);clientId=newC.id;
    }
  }
  // Resolve project / category: existing ID or create new from typed text
  let projId=document.getElementById('bl_proj')?.value||null;
  if(!projId){
    const newName=document.getElementById('bl_proj_txt')?.value?.trim();
    if(newName){
      const newP={id:uid(),clientId:clientId||null,name:newName,rate:null,status:'active',createdAt:new Date().toISOString()};
      const allP=load(KEYS.projects);allP.push(newP);save(KEYS.projects,allP);projId=newP.id;
    }
  }
  const all=DB.backlog();
  if(!id){
    const tl=title.toLowerCase();
    const dupe=all.find(b=>!b.archivedAt&&b.title.toLowerCase()===tl);
    if(dupe) toast(`Heads up: similar item exists — "${dupe.title}"`,'err');
  }
  const visibility=document.getElementById('bl_vis')?.value||'public';
  const assignedTo=document.getElementById('bl_assigned')?.value||null;
  const myId=activeViewer();
  const now=new Date().toISOString();
  if(id){
    const i=all.findIndex(x=>x.id===id);
    if(i>=0) all[i]={...all[i],title,description:desc,priority,effort,dueDate,urgent,recurring,recurFrequency,clientId,projectId:projId,visibility,assignedTo,lastTouchedAt:now};
  } else {
    all.push({id:uid(),title,description:desc,priority,effort,dueDate,urgent,recurring,recurFrequency,clientId,projectId:projId,weekOf:null,archivedAt:null,visibility,assignedTo,createdBy:myId,createdAt:now,lastTouchedAt:now});
  }
  DB.saveBack(all);
  closeModal();render();toast(id?'Item updated ✓':'Added to backlog ✓');
}
function delBacklogItem(id){if(!confirm('Delete this item?'))return;DB.saveBack(DB.backlog().filter(x=>x.id!==id));render();toast('Item deleted');}
function delBacklogItemSilent(id){DB.saveBack(DB.backlog().filter(x=>x.id!==id));render();}
function promoteToWeek(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  all[i]={...all[i],weekOf:currentWeek(),lastTouchedAt:new Date().toISOString()};
  DB.saveBack(all);render();toast('Moved to This Week ✓');
}
function pullToBacklog(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  all[i]={...all[i],weekOf:null,lastTouchedAt:new Date().toISOString()};
  DB.saveBack(all);render();
}
function markItemDone(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  const now=new Date().toISOString();
  const item=all[i];
  all[i]={...item,archivedAt:now,completedAt:now};
  if(item.recurring&&item.recurFrequency){
    // Respawn a fresh copy for the next cycle
    const nextDue = item.dueDate ? nextRecurDate(item.dueDate,item.recurFrequency) : null;
    all.push({...item,id:uid(),weekOf:null,archivedAt:null,completedAt:null,dueDate:nextDue,createdAt:now,lastTouchedAt:now});
  }
  DB.saveBack(all);render();toast(item.recurring?'Done ✓ — next occurrence added to backlog':'Done ✓');
}
function archiveItem(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  all[i]={...all[i],archivedAt:new Date().toISOString()};
  DB.saveBack(all);render();
}
function keepItem(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  all[i]={...all[i],lastTouchedAt:new Date().toISOString()};
  DB.saveBack(all);render();toast('Kept ✓');
}
function showArchive(){
  const all=DB.backlog();
  const archived=all.filter(i=>i.archivedAt).sort((a,b)=>b.archivedAt.localeCompare(a.archivedAt));
  const clients=DB.clients(true),clientMap={};
  clients.forEach(c=>clientMap[c.id]=c);
  const rows=archived.map(item=>{
    const client=clientMap[item.clientId];
    return `<div class="flex items-center gap-3 py-2 border-b border-gray-100 last:border-0">
      <div class="flex-1 min-w-0">
        <div class="text-sm text-gray-700 font-medium">${esc(item.title)}</div>
        ${client?`<div class="text-xs" style="color:${client.color||'#888'}">● ${esc(client.name)}</div>`:''}
      </div>
      <div class="text-xs text-gray-400 flex-shrink-0">${item.completedAt?'✓ done':'archived'} ${new Date(item.archivedAt).toLocaleDateString()}</div>
      <button onclick="restoreItem('${item.id}')" class="text-xs text-teal-600 hover:text-teal-800 flex-shrink-0 hover:underline">Restore</button>
    </div>`;
  }).join('');
  showModal(`<div class="flex items-center justify-between mb-4"><h3 class="text-base font-bold text-gray-800">Archive</h3><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">×</button></div>
    ${archived.length===0
      ?'<div class="text-center text-gray-400 py-8 text-sm">Nothing archived yet</div>'
      :`<div class="text-xs text-gray-400 mb-3">${archived.length} item${archived.length===1?'':'s'}</div>${rows}`
    }`);
}
function restoreItem(id){
  const all=DB.backlog(),i=all.findIndex(x=>x.id===id);
  if(i<0)return;
  all[i]={...all[i],archivedAt:null,completedAt:null,weekOf:null};
  DB.saveBack(all);closeModal();render();toast('Item restored ✓');
}

// ═══════════════════════════════════════════════
//  USER SELECT
// ═══════════════════════════════════════════════

function refreshUserSelect(){
  const sel=document.getElementById('activeUserSelect'), users=DB.users(), settings=DB.settings();
  if(!sel)return;
  const activeId = getActiveUserId();
  sel.innerHTML=users.length===0?'<option value="">No users</option>':users.map(u=>`<option value="${u.id}"${u.id===activeId?' selected':''}>${esc(u.name)}</option>`).join('');
  sel.onchange=()=>State.setActiveUser(sel.value);
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════

async function init(){
  // Check if already logged in
  const { data: { session } } = await _sb.auth.getSession();
  if(!session){ renderLogin(); return; }

  // Pull all shared data from Supabase into cache
  await syncAll();

  // One-time migration: if Supabase is empty, import existing localStorage data
  await maybeImportLocalStorage();

  // Data shape upgrades
  migrate();
  migrateBacklogModel();
  migrateVisibility();

  // Link this auth user to a team member record
  await ensureTeamMember(session.user);

  // Merge any duplicate "me" records (e.g. localStorage import + auth account mismatch)
  deduplicateSelf();

  // Backfill entries with no userId → current user
  migrateUserIds();

  refreshUserSelect();
  navigate('dashboard');
  TimerEngine.init();

  document.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
    const map={d:'dashboard',t:'timer',l:'log',e:'expenses',c:'clients',b:'backlog',r:'reports',s:'settings'};
    if(map[e.key]){navigate(map[e.key]);return;}
    if(e.key==='Escape')closeModal();
  });
}

init();
</script>
</body>
</html>
